<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="JetBrainsMonoNL Nerd Font Mono, DejaVu Sans Mono, ui-monospace, monospace">
  <!-- Catppuccin Mocha ground -->
  <rect width="1200" height="630" fill="#11111b"/>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#cdd6f4" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="45%" r="85%">
      <stop offset="45%" stop-color="#11111b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#11111b" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- terminal frame -->
  <rect x="80" y="70" width="1040" height="490" fill="#1e1e2e" stroke="#45475a"/>

  <!-- chrome -->
  <rect x="80.5" y="70.5" width="1039" height="34" fill="#181825"/>
  <line x1="80" y1="104" x2="1120" y2="104" stroke="#45475a"/>
  <circle cx="102" cy="87" r="4" fill="#cba6f7"/>
  <text x="114" y="92" font-size="14" letter-spacing="1.4" fill="#cdd6f4">01:WHOAMI</text>
  <text x="250" y="92" font-size="14" letter-spacing="1.4" fill="#7f849c">02:PROJECTS</text>
  <text x="1096" y="92" font-size="14" text-anchor="end" fill="#6c7086">hypervapor.org — zsh — 96×24</text>

  <!-- bio -->
  <text x="116" y="176" font-size="19" fill="#7f849c">
    <tspan fill="#a6e3a1">hypervapor</tspan><tspan fill="#6c7086">@</tspan><tspan fill="#a6e3a1">localhost</tspan> <tspan fill="#89b4fa">~</tspan> <tspan fill="#cba6f7">%</tspan> <tspan fill="#cdd6f4">whoami</tspan>
  </text>
  <text x="112" y="256" font-size="58" font-weight="bold" fill="#cdd6f4">Now building <tspan fill="#cba6f7">Riffpad.ai</tspan></text>
  <rect x="918" y="212" width="26" height="46" fill="#cba6f7"/>
  <text x="116" y="316" font-size="19" fill="#a6adc8">
    <tspan fill="#6c7086">//</tspan> quiet tooling for loud problems.
  </text>

  <!-- projects -->
  <line x1="80" y1="352" x2="1120" y2="352" stroke="#313244"/>
  <text x="116" y="390" font-size="19" fill="#7f849c"><tspan fill="#cba6f7">%</tspan> <tspan fill="#cdd6f4">ls -la ~/projects</tspan></text>

  <text x="145" y="428" font-size="19" fill="#cdd6f4">riffpad.ai</text>
  <text x="300" y="428" font-size="15" fill="#6c7086">web · audio</text>
  <rect x="1008" y="412" width="72" height="22" fill="none" stroke="#a6e3a1" stroke-opacity="0.5"/>
  <text x="1044" y="428" font-size="13" letter-spacing="1.2" text-anchor="middle" fill="#a6e3a1">LIVE</text>

  <text x="145" y="466" font-size="19" fill="#cdd6f4">herdr-pair-coding</text>
  <text x="418" y="466" font-size="15" fill="#6c7086">python · agents</text>
  <rect x="1008" y="450" width="72" height="22" fill="none" stroke="#fab387" stroke-opacity="0.6"/>
  <text x="1044" y="466" font-size="13" letter-spacing="1.2" text-anchor="middle" fill="#fab387">NEW</text>

  <!-- featured -->
  <text x="145" y="512" font-size="17" fill="#a6adc8">
    <tspan fill="#fab387">◆</tspan> worker–reviewer pair coding on herdr
  </text>

  <!-- statusline -->
  <rect x="80" y="526" width="1040" height="34" fill="#181825"/>
  <line x1="80" y1="526" x2="1120" y2="526" stroke="#45475a"/>
  <rect x="80" y="526" width="96" height="34" fill="#cba6f7"/>
  <text x="128" y="549" font-size="14" font-weight="bold" letter-spacing="1.6" text-anchor="middle" fill="#11111b">NORMAL</text>
  <text x="192" y="549" font-size="14" fill="#7f849c">hypervapor@localhost</text>
  <text x="382" y="549" font-size="14" fill="#a6e3a1">⎇ main</text>
  <text x="462" y="549" font-size="14" fill="#7f849c">utf-8</text>
  <text x="880" y="549" font-size="14" text-anchor="end" fill="#7f849c">ln 1, col 1</text>
  <text x="996" y="549" font-size="14" text-anchor="end" fill="#7f849c">⏎ featured</text>
  <text x="1108" y="549" font-size="14" text-anchor="end" fill="#9399b2">03:00 UTC</text>

  <rect width="1200" height="630" fill="url(#vig)"/>
</svg>
